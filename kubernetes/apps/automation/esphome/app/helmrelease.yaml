---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: esphome
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: esphome
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          main:
            image:
              repository: esphome/esphome
              tag: "2026.10.2@sha256:c994a49a945094643b14c213bfd500a95ffed94cd68848772828192e126bd375"
            env:
              TZ: Europe/Amsterdam
              ESPHOME_DEFAULT_COMPILE_PROCESS_LIMIT: "4"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 6052
    persistence:
      config:
        existingClaim: esphome
        globalMounts:
          - path: /config
    route:
      main:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - esphome.bo0tzz.me
        rules:
          - backendRefs:
              - identifier: main
                port: 6052
