---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: memos
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/usememos/memos
              tag: 26.11.0@sha256:087e7dc6b76b31fcd1107a5767398b2a310ced209adb791efd8760c745dc8034
            env:
              TZ: Europe/Amsterdam
              MEMOS_INSTANCE_URL: https://memos.bo0tzz.me
              MEMOS_DRIVER: postgres
              MEMOS_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memos-app
                    key: uri
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 5230
                  periodSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    configMaps:
      settings:
        data:
          settings.json: |
            {
              "instanceSettings": [
                {
                  "name": "instance/settings/GENERAL",
                  "generalSetting": {
                    "disallowPasswordAuth": true,
                    "weekStartDayOffset": 1
                  }
                },
                {
                  "name": "instance/settings/ACCESS",
                  "accessSetting": {
                    "accessMode": "INSTANCE_ACCESS_MODE_PRIVATE"
                  }
                },
                {
                  "name": "instance/settings/STORAGE",
                  "storageSetting": {
                    "storageType": "DATABASE"
                  }
                },
                {
                  "name": "instance/settings/USAGE_LIMITS",
                  "usageLimitsSetting": {
                    "limits": [
                      {
                        "allUsers": true,
                        "memoContentBytes": "8192",
                        "uploadBytes": "33554432"
                      }
                    ]
                  }
                }
              ]
            }
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /var/opt/memos
      config:
        type: custom
        volumeSpec:
          projected:
            sources:
              - configMap:
                  name: memos
              - secret:
                  name: memos-idp
        globalMounts:
          - path: /etc/memos/config
            readOnly: true
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    route:
      main:
        parentRefs:
          - name: envoy-external
            namespace: network
        hostnames:
          - memos.bo0tzz.me
        rules:
          - backendRefs:
              - identifier: main
                port: *port
