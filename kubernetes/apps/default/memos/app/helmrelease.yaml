---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: memos
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/usememos/memos
              tag: 0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
            env:
              TZ: Europe/Amsterdam
              MEMOS_INSTANCE_URL: https://memos.bo0tzz.me
              MEMOS_DRIVER: postgres
              MEMOS_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memos-app
                    key: uri
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 5230
                  periodSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    configMaps:
      settings:
        data:
          # Every deployment-configurable key is pinned so none of it is editable in the UI.
          # An empty message means memos' built-in defaults.
          memos-instance-setting-general.json: |
            {
              "key": "GENERAL",
              "generalSetting": {
                "disallowPasswordAuth": true,
                "weekStartDayOffset": 1
              }
            }
          # First DB init seeds PUBLIC whenever MEMOS_INSTANCE_URL is set.
          memos-instance-setting-access.json: |
            {
              "key": "ACCESS",
              "accessSetting": {
                "accessMode": "INSTANCE_ACCESS_MODE_PRIVATE"
              }
            }
          # Default is LOCAL, which would land attachments on the emptyDir.
          memos-instance-setting-storage.json: |
            {
              "key": "STORAGE",
              "storageSetting": {
                "storageType": "DATABASE"
              }
            }
          memos-instance-setting-memo-related.json: |
            {
              "key": "MEMO_RELATED",
              "memoRelatedSetting": {}
            }
          memos-instance-setting-notification.json: |
            {
              "key": "NOTIFICATION",
              "notificationSetting": {}
            }
          memos-instance-setting-ai.json: |
            {
              "key": "AI",
              "aiSetting": {}
            }
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /var/opt/memos
      config:
        type: custom
        volumeSpec:
          projected:
            sources:
              - configMap:
                  name: memos
              - secret:
                  name: memos-idp
        globalMounts:
          - path: /etc/secrets
            readOnly: true
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    route:
      main:
        parentRefs:
          - name: envoy-external
            namespace: network
        hostnames:
          - memos.bo0tzz.me
        rules:
          - backendRefs:
              - identifier: main
                port: *port
