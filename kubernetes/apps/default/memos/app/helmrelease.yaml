---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: memos
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: memos
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/usememos/memos
              tag: 0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
            env:
              TZ: Europe/Amsterdam
              MEMOS_INSTANCE_URL: https://memos.bo0tzz.me
              MEMOS_DRIVER: postgres
              MEMOS_DSN:
                valueFrom:
                  secretKeyRef:
                    name: memos-app
                    key: uri
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 5230
                  periodSeconds: 10
              readiness: *probe
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
    configMaps:
      settings:
        data:
          # File-backed settings are authoritative: the whole GENERAL group becomes read-only in the UI.
          memos-instance-setting-general.json: |
            {
              "key": "GENERAL",
              "generalSetting": {
                "disallowPasswordAuth": true,
                "weekStartDayOffset": 1
              }
            }
          # First DB init seeds PUBLIC whenever MEMOS_INSTANCE_URL is set.
          memos-instance-setting-access.json: |
            {
              "key": "ACCESS",
              "accessSetting": {
                "accessMode": "INSTANCE_ACCESS_MODE_PRIVATE"
              }
            }
    persistence:
      data:
        type: emptyDir
        globalMounts:
          - path: /var/opt/memos
      settings:
        type: configMap
        identifier: settings
        globalMounts:
          - path: /etc/secrets/memos-instance-setting-general.json
            subPath: memos-instance-setting-general.json
          - path: /etc/secrets/memos-instance-setting-access.json
            subPath: memos-instance-setting-access.json
      idp:
        type: secret
        name: memos-idp
        globalMounts:
          - path: /etc/secrets/memos-idp-authentik.json
            subPath: memos-idp-authentik.json
    service:
      main:
        controller: main
        ports:
          http:
            port: *port
    route:
      main:
        parentRefs:
          - name: envoy-external
            namespace: network
        hostnames:
          - memos.bo0tzz.me
        rules:
          - backendRefs:
              - identifier: main
                port: *port
