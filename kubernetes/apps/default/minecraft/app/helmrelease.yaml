---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
spec:
  interval: 1h
  chart:
    spec:
      chart: minecraft
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: itzg-minecraft
  values:
    podSecurityContext:
      runAsUser: 568
      runAsGroup: 568
      runAsNonRoot: true
      fsGroup: 568
      fsGroupChangePolicy: OnRootMismatch
    image:
      repository: itzg/minecraft-server
      tag: 2026.11.1-java25@sha256:0634ff76eee896c7e9760a35117d24fad394857d10bc8c1d9bc7f7ff7deef3c2
    resources:
      requests:
        cpu: 100m
        memory: 3Gi
      limits:
        memory: 4Gi
    minecraftServer:
      eula: "TRUE"
      version: "26.1.2"
      whitelist: Dylan_rengers,bo0tzz
      ops: Dylan_rengers,bo0tzz
      maxWorldSize: 29999984
      spawnProtection: 0
      pvp: true
      memory: 3000M
      serviceType: LoadBalancer
      rcon:
        enabled: true
      type: "FABRIC"
      modrinth:
        projects: ["worldedit"]
    # top-level (chart 5.1.3 ignores minecraftServer.serviceAnnotations)
    serviceAnnotations:
      lbipam.cilium.io/ips: "10.0.10.105"
      external-dns.kubernetes.io/hostname: mc.bo0tzz.me
      external-dns.kubernetes.io/target: "45.142.19.143"
    podAnnotations:
      descheduler.alpha.kubernetes.io/prefer-no-eviction: ""
    persistence:
      dataDir:
        enabled: true
        existingClaim: minecraft
