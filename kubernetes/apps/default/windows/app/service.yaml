---
apiVersion: v1
kind: Service
metadata:
  name: windows-rdp
  annotations:
    external-dns.kubernetes.io/hostname: windows.bo0tzz.me
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: windows
  ports:
    - name: rdp-tcp
      protocol: TCP
      port: 3389
    - name: rdp-udp
      protocol: UDP
      port: 3389
