apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-gpu-resource-driver
spec:
  chartRef:
    kind: OCIRepository
    name: intel-gpu-resource-driver
  interval: 1h
  values:
    cdi:
      staticPath: /var/cdi/static
      dynamicPath: /var/cdi/dynamic
    # Ships a NodeFeatureRule (labels Intel-GPU nodes) and scopes the kubelet
    # plugin to it via NFD.
    nodeFeatureRules:
      enabled: true
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: intel-gpu-resource-driver-kubelet-plugin
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: infra-node
              # Grows Battlemage VRAM BARs on boards without Resizable BAR (dusty) before the plugin
              # hands the card out; see rebar.py.
              - op: add
                path: /spec/template/spec/initContainers
                value:
                  - name: rebar
                    image: docker.io/library/python:3.15-alpine@sha256:20a82dbc2783112ddb91d1534603f802d222a3e63e593cd002eb2ac534e70211
                    command: ["python3", "-u", "/scripts/rebar.py"]
                    securityContext:
                      privileged: true
                    resources:
                      requests:
                        cpu: 1m
                        memory: 8Mi
                      limits:
                        memory: 64Mi
                    volumeMounts:
                      - name: rebar
                        mountPath: /scripts
                      - name: host-proc
                        mountPath: /host/proc
                        readOnly: true
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: rebar
                  configMap:
                    name: gpu-rebar
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: host-proc
                  hostPath:
                    path: /proc
