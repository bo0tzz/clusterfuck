---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: node-feature-discovery
  values:
    master:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    worker:
      priorityClassName: infra-node
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
    gc:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
  # The chart renders both the top-level and worker priorityClassName into the
  # worker DaemonSet (duplicate key), so master/gc get theirs via patch instead.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: node-feature-discovery-(master|gc)
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: infra
