---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubevirt
spec:
  healthCheckExprs:
    - apiVersion: kubevirt.io/v1
      kind: KubeVirt
      current: status.phase == 'Deployed'
  interval: 1h
  path: ./kubernetes/apps/infrastructure/kubevirt/kubevirt/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 15m
  wait: true
