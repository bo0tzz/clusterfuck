apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: futo-backups
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: futo-backups
    namespace: media
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/futo-org/backups/standalone
              tag: "v1.11.5@sha256:dce1f5b9a6e21e60a66921c83d59100ab2ac8e215303add474c462a7f75518a4"
            env:
              TZ: Europe/Amsterdam
            securityContext:
              runAsUser: 568
              runAsGroup: 568
              runAsNonRoot: true
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 22676
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 4Gi
    defaultPodOptions:
      securityContext:
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        ports:
          http:
            port: 22676
    route:
      main:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - futo-backups.bo0tzz.me
        rules:
          - backendRefs:
              - identifier: main
                port: 22676
    persistence:
      data:
        existingClaim: futo-backups-data
        globalMounts:
          - path: /data
      cache:
        existingClaim: futo-backups-cache
        globalMounts:
          - path: /cache
      media:
        existingClaim: media-library
        globalMounts:
          - path: /target/media-library
            readOnly: true
