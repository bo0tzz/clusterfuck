apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: futo-backups-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ssd-block
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: futo-backups-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: ssd-block
