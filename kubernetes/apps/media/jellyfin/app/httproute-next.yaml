---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin-next
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - jellyfin.next.bo0tzz.me
  rules:
    # only browsers get moved; apps keep using the API here until repointed
    - matches:
        - path:
            type: Exact
            value: /
        - path:
            type: PathPrefix
            value: /web
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: jellyfin.bo0tzz.me
            statusCode: 308
    - backendRefs:
        - name: jellyfin
          port: 8096
