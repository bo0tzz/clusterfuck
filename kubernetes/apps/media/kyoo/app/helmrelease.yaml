apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyoo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: kyoo
  values:
    global:
      postgres:
        shared:
          host: kyoo-rw
          databaseOverride: kyoo
          existingSecret: kyoo-app
          userKey: username
          passwordKey: password
    kyoo:
      address: https://kyoo.bo0tzz.me
      middlewareRootURL: https://kyoo.bo0tzz.me
      transcoderAcceleration: disabled
      auth:
        guestClaims: ""
        privatekey:
          existingSecret: kyoo-secret
        apikeys:
          scanner:
            existingSecret: kyoo-secret
    contentdatabase:
      tmdb:
        existingSecret: kyoo-secret
    media:
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-library
            readOnly: true
      volumeMounts:
        - name: media
          mountPath: /media
          readOnly: true
      baseMountPath: /media
    traefikproxy:
      enabled: false
    api:
      kyoo_api:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
      persistence:
        size: 10Gi
        storageClass: ssd-block
    auth:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      kyoo_auth:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      persistence:
        size: 1Gi
        storageClass: ssd-block
    front:
      kyoo_front:
        livenessProbe: &frontProbe
          httpGet:
            path: /
            port: main
        readinessProbe: *frontProbe
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
    scanner:
      kyoo_scanner:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 2Gi
    transcoder:
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 32Gi
      kyoo_transcoder:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 4Gi
      persistence:
        size: 20Gi
        storageClass: ssd-block
