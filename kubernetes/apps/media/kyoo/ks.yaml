apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-kyoo-bucket
spec:
  interval: 1h
  path: ./kubernetes/apps/media/kyoo/bucket
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/bucket
  postBuild:
    substitute:
      BUCKET: kyoo
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: media-kyoo
spec:
  interval: 1h
  path: ./kubernetes/apps/media/kyoo/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/postgres
  dependsOn:
    - name: media-kyoo-bucket
    - name: cnpg-barman-cloud
      namespace: operators
  postBuild:
    substitute:
      APP: kyoo
      BUCKET: kyoo
    substituteFrom:
      - kind: Secret
        name: kyoo
