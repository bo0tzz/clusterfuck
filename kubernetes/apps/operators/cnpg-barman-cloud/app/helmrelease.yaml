---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg-barman-cloud
spec:
  chartRef:
    kind: OCIRepository
    name: cnpg-barman-cloud
  interval: 1h
  values:
    priorityClassName: infra
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        memory: 96Mi
