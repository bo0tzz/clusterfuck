---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: volsync
spec:
  chartRef:
    kind: OCIRepository
    name: volsync
  interval: 1h
  values:
    manageCRDs: true
    metrics:
      disableAuth: true
    resources:
      requests:
        cpu: 10m
        memory: 192Mi
      limits:
        memory: 512Mi
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: volsync-volsync-perfectra1n
            patch: |
              - op: add
                path: /spec/template/spec/priorityClassName
                value: infra
