---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runner-clusterfuck
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  values:
    githubConfigUrl: https://github.com/bo0tzz/clusterfuck
    githubConfigSecret: github-runner-auth
    runnerScaleSetName: clusterfuck
    minRunners: 0
    maxRunners: 2
    controllerServiceAccount:
      namespace: actions-controller
      name: actions-runner-controller-gha-rs-controller
    template:
      spec:
        priorityClassName: batch
        serviceAccountName: flux-triage-runner
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.338.1@sha256:e275409999c37162649aa050ca573f03eab2eabcb3a1e7fcc47548de6b4f9690
            command: ["/home/runner/run.sh"]
