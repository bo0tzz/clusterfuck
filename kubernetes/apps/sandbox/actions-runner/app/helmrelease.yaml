---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actions-runner-clusterfuck
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  values:
    githubConfigUrl: https://github.com/bo0tzz/clusterfuck
    githubConfigSecret: github-runner-auth
    runnerScaleSetName: clusterfuck
    minRunners: 0
    maxRunners: 2
    controllerServiceAccount:
      namespace: actions-controller
      name: actions-runner-controller-gha-rs-controller
    template:
      spec:
        priorityClassName: batch
        serviceAccountName: flux-triage-runner
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
            command: ["/home/runner/run.sh"]
