---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
spec:
  instances: 1
  enablePDB: false
  priorityClassName: database
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  storage:
    size: 2Gi
    storageClass: ssd-block
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: litellm
      owner: litellm
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
