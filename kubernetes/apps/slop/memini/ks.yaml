---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memini-bucket
spec:
  interval: 1h
  path: ./kubernetes/apps/slop/memini/bucket
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/bucket
  postBuild:
    substitute:
      BUCKET: memini
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: memini
spec:
  interval: 1h
  path: ./kubernetes/apps/slop/memini/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/postgres-single
  dependsOn:
    - name: memini-bucket
    - name: cnpg-barman-cloud
      namespace: operators
    - name: ovms
  postBuild:
    substitute:
      APP: memini
      BUCKET: memini
    substituteFrom:
      - kind: Secret
        name: memini
