---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ovms
spec:
  interval: 1h
  path: ./kubernetes/apps/slop/ovms/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/gpu
  postBuild:
    substitute:
      APP: ovms
      GPU_CEL: 'device.attributes["gpu.intel.com"].pciId == "0xe212"'
