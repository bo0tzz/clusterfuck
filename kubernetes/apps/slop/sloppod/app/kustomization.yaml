---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: slop
resources:
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./securitypolicy.yaml
  - ./secret.sops.yaml
  - ./oidc-secret.sops.yaml
patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
    patch: |-
      - op: remove
        path: /spec/bootstrap/recovery
