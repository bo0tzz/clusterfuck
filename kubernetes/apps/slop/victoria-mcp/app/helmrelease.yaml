---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-mcp
  values:
    controllers:
      metrics:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/victoriametrics/mcp-victoriametrics
              tag: v1.20.2@sha256:bcbf84f945d6efb03fb8b2d2ccc3294420dccdc0b445752dce96f02619416dfe
            env:
              VM_INSTANCE_ENTRYPOINT: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
              VM_INSTANCE_TYPE: single
              # upstream defaults + documentation (~500Mi in-memory index)
              MCP_DISABLED_TOOLS: export,flags,metric_relabel_debug,downsampling_filters_debug,retention_filters_debug,test_rules,documentation
              MCP_SERVER_MODE: http
              MCP_LISTEN_ADDR: :8080
              MCP_LOG_FORMAT: json
            probes: &probes
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 8080
            resources: &resources
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
      logs:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/victoriametrics/mcp-victorialogs
              tag: v1.9.0@sha256:753bb4fbe402ca1a782842f44636830f9895736f11d7fe783b924f8a0daf083d
            env:
              VL_INSTANCE_ENTRYPOINT: http://victoria-logs-victoria-logs-single-server.monitoring.svc.cluster.local:9428
              MCP_SERVER_MODE: http
              MCP_LISTEN_ADDR: :8080
              MCP_LOG_FORMAT: json
            probes: *probes
            resources: *resources
            securityContext: *securityContext
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    service:
      metrics:
        controller: metrics
        ports:
          http:
            port: 8080
      logs:
        controller: logs
        ports:
          http:
            port: 8080
