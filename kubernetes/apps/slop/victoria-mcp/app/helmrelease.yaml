---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-mcp
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: victoria-mcp
  values:
    controllers:
      metrics:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/victoriametrics/mcp-victoriametrics
              tag: v1.20.2
            env:
              VM_INSTANCE_ENTRYPOINT: http://vmsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local:8428
              VM_INSTANCE_TYPE: single
              MCP_SERVER_MODE: http
              MCP_LISTEN_ADDR: :8080
              MCP_LOG_FORMAT: json
            probes: &probes
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveness
                    port: 8080
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 8080
            resources: &resources
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
      logs:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/victoriametrics/mcp-victorialogs
              tag: v1.9.0
            env:
              VL_INSTANCE_ENTRYPOINT: http://victoria-logs-victoria-logs-single-server.monitoring.svc.cluster.local:9428
              MCP_SERVER_MODE: http
              MCP_LISTEN_ADDR: :8080
              MCP_LOG_FORMAT: json
            probes: *probes
            resources: *resources
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    service:
      metrics:
        controller: metrics
        ports:
          http:
            port: 8080
      logs:
        controller: logs
        ports:
          http:
            port: 8080
