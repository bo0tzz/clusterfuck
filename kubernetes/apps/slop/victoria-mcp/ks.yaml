---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: victoria-mcp
spec:
  dependsOn:
    - name: victoria-metrics-k8s-stack
      namespace: monitoring
    - name: victoria-logs
      namespace: monitoring
  interval: 1h
  path: ./kubernetes/apps/slop/victoria-mcp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
