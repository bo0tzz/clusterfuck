---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sable
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: sable
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
    controllers:
      sable:
        replicas: 2
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: git.sable.moe/sableclient/sable-next
              tag: "2.0.3@sha256:f53b10df59324463daff7ed743935d93f69b78ca7936fb11bdfc965cd0dfe179"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /index.html
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 30
              readiness: *probe
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
    route:
      app:
        hostnames:
          - sable.bo0.tz
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    persistence:
      config-file:
        type: configMap
        name: sable-config
        globalMounts:
          - path: /app/config.json
            subPath: config.json
            readOnly: true
      # Caddy needs writable XDG data/config dirs (image owns them as nobody, not our uid)
      data:
        type: emptyDir
        globalMounts:
          - path: /data
      config:
        type: emptyDir
        globalMounts:
          - path: /config
