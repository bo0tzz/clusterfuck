---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: labelabelabel
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: labelabelabel
    namespace: tools
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        containers:
          main:
            image:
              repository: ghcr.io/bo0tzz/labelabelabel
              tag: 0.1.0@sha256:96cb5de219f1baeb7d50ad1eb8f1706d131067c6161bfb0d8ad741fead3beb95
            env:
              PRINTER_HOST: 192.168.178.109
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 20m
                memory: 192Mi
              limits:
                memory: 384Mi
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    route:
      main:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - label.bo0tzz.me
        rules:
          - backendRefs:
              - identifier: main
                port: 3000
    persistence:
      data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /data
