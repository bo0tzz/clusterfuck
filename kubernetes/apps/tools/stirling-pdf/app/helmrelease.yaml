apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: stirling-pdf
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: stirling-pdf
    namespace: tools
  values:
    controllers:
      main:
        strategy: RollingUpdate
        containers:
          main:
            image:
              repository: ghcr.io/stirling-tools/s-pdf
              tag: "3.1.0@sha256:b5b9e400c086e5334a4947a0d7cd589808f743f29267d7f41c18200cf4bc48b4"
            env:
              SYSTEM_ENABLEANALYTICS: "false"
              SYSTEM_ENABLEPOSTHOG: "false"
              SYSTEM_ENABLESCARF: "false"
              SECURITY_ENABLELOGIN: "false"
            resources:
              requests:
                cpu: 50m
                memory: 1.5Gi
              limits:
                memory: 4Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    route:
      main:
        parentRefs:
          - name: envoy-internal
            namespace: network
        hostnames:
          - pdf.bo0tzz.me
        rules:
          - backendRefs:
              - identifier: main
                port: 8080
