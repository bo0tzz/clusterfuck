---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openproject-valkey
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openproject-valkey
  values:
    controllers:
      main:
        pod:
          priorityClassName: database
        containers:
          main:
            image:
              repository: docker.io/valkey/valkey
              tag: "9.2.0@sha256:1c2b25b09f354c66fe994733acdf12fcfd4bdf6f3bd92b88a93a70378d884056"
            args:
              - --save
              - ""
              - --maxmemory
              - 96mb
              - --maxmemory-policy
              - allkeys-lru
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      main:
        controller: main
        ports:
          redis:
            port: 6379
