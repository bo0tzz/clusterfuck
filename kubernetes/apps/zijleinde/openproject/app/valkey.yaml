---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openproject-valkey
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openproject-valkey
  values:
    controllers:
      main:
        pod:
          priorityClassName: database
        containers:
          main:
            image:
              repository: docker.io/valkey/valkey
              tag: "9.2.0@sha256:13010f40f0623c52f0d3527a48bbf059870e6864b4eee642cdabad3f5e240e69"
            args:
              - --save
              - ""
              - --maxmemory
              - 96mb
              - --maxmemory-policy
              - allkeys-lru
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      main:
        controller: main
        ports:
          redis:
            port: 6379
