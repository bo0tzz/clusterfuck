---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openproject-valkey
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openproject-valkey
  values:
    controllers:
      main:
        pod:
          priorityClassName: database
        containers:
          main:
            image:
              repository: docker.io/valkey/valkey
              tag: "9.2.1@sha256:169567d6288e5f08aa141847c0c3e0864a32e727682ca6f052a20567c7103ef8"
            args:
              - --save
              - ""
              - --maxmemory
              - 96mb
              - --maxmemory-policy
              - allkeys-lru
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      main:
        controller: main
        ports:
          redis:
            port: 6379
