---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openproject-valkey
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: openproject-valkey
  values:
    controllers:
      main:
        pod:
          priorityClassName: database
        containers:
          main:
            image:
              repository: docker.io/valkey/valkey
              tag: "9.1.4@sha256:3ab0eca823ebbf0fe352476ebac330ac9e5f14b592b9a954eab296d341e81b0e"
            args:
              - --save
              - ""
              - --maxmemory
              - 96mb
              - --maxmemory-policy
              - allkeys-lru
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      main:
        controller: main
        ports:
          redis:
            port: 6379
