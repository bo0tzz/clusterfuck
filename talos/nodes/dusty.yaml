---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/fb70074c3d3e2cc972d2c1d14ca526c183796a96fe83ade50539d8c7ffde304f:v1.14.3
provisioning:
  diskSelector:
    match: 'disk.serial == "25034DD0804C"'
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: dusty
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: trunk
selector:
  match: mac(link.permanent_addr) == "00:0f:53:38:e2:a0"
---
apiVersion: v1alpha1
kind: VLANConfig
name: trunk.16
vlanID: 16
vlanMode: 802.1q
parent: trunk
up: true
addresses:
  - address: 10.0.10.11/24
routes:
  - gateway: 10.0.10.1
