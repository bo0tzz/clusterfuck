---
machine:
  type: controlplane
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/759b2b21175fec663f0a9559999d094ba661fe0687e45aac674c944a871ac652:v1.14.5
provisioning:
  diskSelector:
    match: 'disk.serial == "23294BEE1C17"'
  wipe: false
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: tiny
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: trunk
selector:
  match: mac(link.permanent_addr) == "58:47:ca:7a:bf:e7"
---
apiVersion: v1alpha1
kind: VLANConfig
name: trunk.16
vlanID: 16
vlanMode: 802.1q
parent: trunk
up: true
addresses:
  - address: 10.0.10.14/24
routes:
  - gateway: 10.0.10.1
