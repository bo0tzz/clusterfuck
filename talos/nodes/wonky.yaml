---
machine:
  type: controlplane
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/75f944fa6f2e8fd6718f852dae26f3077201c6e0308e1efed6984e9eae17ad64:v1.14.4
provisioning:
  diskSelector:
    match: 'disk.serial == "23294BEE189B"'
  wipe: true
---
apiVersion: v1alpha1
kind: HostnameConfig
auto: 'off'
hostname: wonky
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: trunk
selector:
  match: mac(link.permanent_addr) == "28:80:23:91:3f:64"
---
apiVersion: v1alpha1
kind: VLANConfig
name: trunk.16
vlanID: 16
vlanMode: 802.1q
parent: trunk
up: true
addresses:
  - address: 10.0.10.12/24
routes:
  - gateway: 10.0.10.1
---
apiVersion: v1alpha1
kind: UdevRulesConfig
rules:
  # sriov_totalvfs only exists on the PF.
  - 'ACTION=="bind", SUBSYSTEM=="pci", DRIVER=="xe", ATTR{vendor}=="0x8086", ATTR{device}=="0xe212", ATTR{sriov_totalvfs}=="?*", ATTR{sriov_numvfs}="3"'
